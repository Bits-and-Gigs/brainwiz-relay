# BrainWiz Relay — Fly.io configuration
# Domain: relay.brainwiz.app

app = 'brainwiz-relay'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Must stay 'off' — auto-stop drops WebSocket tunnels for all users.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 5000
    soft_limit = 4000

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[[mounts]]
  source = 'brainwiz_relay_data'
  destination = '/data'
